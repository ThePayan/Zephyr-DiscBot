name: "Enforce Zenhub 'Done' Status via UI Connection"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-zenhub-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check Zenhub Connected Issue Status
        env:
          ZENHUB_TOKEN: ${{ secrets.ZENHUB_TOKEN }}
          # GitHub provee automáticamente estos datos en las Actions
          GITHUB_REPO_ID: ${{ github.event.repository.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Consultando el estado de la PR #$PR_NUMBER en el tablero de Zenhub..."
          
          # Hacemos la petición a la API REST pública (p1) de Zenhub
          RESPONSE=$(curl -s -H "X-Authentication-Token: $ZENHUB_TOKEN" \
            "https://api.zenhub.com/p1/repositories/$GITHUB_REPO_ID/issues/$PR_NUMBER")
          
          echo "Respuesta cruda de Zenhub: $RESPONSE"
          
          # Validamos si la respuesta es un JSON válido
          if ! echo "$RESPONSE" | jq -e . >/dev/null 2>&1; then
            echo "❌ Error: Zenhub no devolvió un JSON válido. Revisa el Token."
            exit 1
          fi
          
          # Extraemos el nombre de la columna (pipeline)
          PIPELINE_NAME=$(echo "$RESPONSE" | jq -r '.pipeline.name')
          
          # Si devuelve null, la PR no está trackeada en el tablero
          if [ "$PIPELINE_NAME" == "null" ] || [ -z "$PIPELINE_NAME" ]; then
            echo "❌ Error: Esta PR no tiene una columna asignada en Zenhub. Conéctala a una Issue primero."
            exit 1
          fi
          
          echo "La tarjeta de esta PR en Zenhub está en la columna: $PIPELINE_NAME"
          
          # Verificamos si la columna es "Done" (o el nombre exacto que uses)
          if [ "$PIPELINE_NAME" != "Done" ]; then
            echo "❌ Error: La PR no se puede mergear. La tarjeta está en '$PIPELINE_NAME'. Muévela a 'Done' (o conecta la PR a una Issue que esté en 'Done')."
            exit 1
          fi
          
          echo "✅ Validación exitosa. La tarjeta está en 'Done'."
