name: "Enforce Zenhub 'Done' Status via UI Connection"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-zenhub-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check Zenhub Connected Issue Status
        env:
          ZENHUB_TOKEN: ${{ secrets.ZENHUB_TOKEN }}
          # GitHub provee automáticamente estos datos en las Actions
          GITHUB_REPO_ID: ${{ github.event.repository.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. Construimos la consulta GraphQL para Zenhub.
          # Buscamos la PR por su número y le pedimos a Zenhub que nos devuelva 
          # las Issues que tiene conectadas y el nombre de su columna (pipeline).
          QUERY=$(cat <<EOF
          {"query": "query { issueByInfo(repositoryGhId: $GITHUB_REPO_ID, issueNumber: $PR_NUMBER) { connectedIssues { nodes { number pipelineIssue { pipeline { name } } } } } }"}
          EOF
          )
          
          # 2. Hacemos la petición a la API de Zenhub
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ZENHUB_TOKEN" \
            -d "$QUERY" \
            "https://api.zenhub.com/public/graphql")
          
          # 3. Extraemos el nombre de la columna usando jq
          PIPELINE_NAME=$(echo "$RESPONSE" | jq -r '.data.issueByInfo.connectedIssues.nodes[0].pipelineIssue.pipeline.name')
          
          # 4. Verificamos si existe conexión
          if [ "$PIPELINE_NAME" == "null" ] || [ -z "$PIPELINE_NAME" ]; then
            echo "❌ Error: Esta PR no está conectada a ninguna Issue. Usa el botón 'Connect to Issue' de Zenhub en la interfaz para enlazarla."
            exit 1
          fi
          
          echo "La PR está conectada a una Issue que está en la columna: $PIPELINE_NAME"
          
          # 5. Verificamos si la columna es "Done"
          if [ "$PIPELINE_NAME" != "Done" ]; then
            echo "❌ Error: La PR no se puede mergear. La issue conectada en Zenhub está en '$PIPELINE_NAME'. Muévela a 'Done' primero."
            exit 1
          fi
          
          echo "✅ Validación exitosa. La issue está en 'Done'."